name: Cord verifier tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install TypeScript compiler
        run: npm install --no-save --no-package-lock typescript@5.8.3 @types/node@22.15.3
      - name: Compile TypeScript EVC verifier
        run: npx tsc --strict --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --rootDir . --outDir build assurance/evc.ts assurance/evc_cli.ts
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
